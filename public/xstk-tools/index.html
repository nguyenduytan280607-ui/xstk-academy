<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XSTK — Công cụ nâng cao</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"><style>/* Layout: app shell — navy rail on the left (bottom tab bar on phones), content column on a faint graph-paper ground */
:root {
  --bg: #F4F6FA;
  --grid: rgba(15, 39, 71, .055);
  --surface: #FFFFFF;
  --surface-2: #EEF2F7;
  --line: #DAE0EA;
  --fg: #0E1B33;
  --muted: #5B6881;
  --rail: #0F2747;
  --rail-2: #173A66;
  --rail-fg: #C9D4E6;
  --crimson: #C41E3A;
  --crimson-ink: #A3172F;
  --crimson-soft: #FBE8EB;
  --gold: #D9971A;
  --gold-soft: #FCF1DC;
  --good: #1D8556;
  --good-soft: #E2F4EA;
  --bad: #C2362F;
  --bad-soft: #FBE6E4;
  --plot-line: #0F2747;
  --plot-fill: rgba(196, 30, 58, .32);
  --plot-grid: rgba(15, 39, 71, .10);
  --shadow: 0 1px 2px rgba(15, 39, 71, .06), 0 8px 24px -12px rgba(15, 39, 71, .18);
  --f-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1322; --grid: rgba(150, 175, 215, .05); --surface: #101C31; --surface-2: #16243D; --line: #233350;
    --fg: #E6ECF6; --muted: #93A2BC; --rail: #070F1D; --rail-2: #12233F; --rail-fg: #A9B7CE;
    --crimson: #FF5C70; --crimson-ink: #FF8091; --crimson-soft: #3A1622; --gold: #F0B54A; --gold-soft: #3A2C12;
    --good: #4CC48A; --good-soft: #10301F; --bad: #FF7468; --bad-soft: #3A1714;
    --plot-line: #C9D6EC; --plot-fill: rgba(255, 92, 112, .38); --plot-grid: rgba(200, 215, 240, .10);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1322; --grid: rgba(150, 175, 215, .05); --surface: #101C31; --surface-2: #16243D; --line: #233350;
  --fg: #E6ECF6; --muted: #93A2BC; --rail: #070F1D; --rail-2: #12233F; --rail-fg: #A9B7CE;
  --crimson: #FF5C70; --crimson-ink: #FF8091; --crimson-soft: #3A1622; --gold: #F0B54A; --gold-soft: #3A2C12;
  --good: #4CC48A; --good-soft: #10301F; --bad: #FF7468; --bad-soft: #3A1714;
  --plot-line: #C9D6EC; --plot-fill: rgba(255, 92, 112, .38); --plot-grid: rgba(200, 215, 240, .10);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--rail); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 1.2rem + 2vw, 2.5rem); font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--crimson); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--crimson); outline-offset: 2px; border-radius: 6px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 .72rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--crimson); }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
math { font-size: 1.06em; }
.math-block { overflow-x: auto; padding: 4px 0; }
.math-block math { font-size: 1.15em; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  background: var(--rail); color: var(--rail-fg); display: flex; flex-direction: column; gap: 18px;
  padding: 20px 14px 16px max(14px, env(safe-area-inset-left, 0px)); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; padding: 0 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--crimson); color: #fff; font: 800 1.25rem/1 var(--f-display); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.brand b { font: 800 1.08rem/1 var(--f-display); letter-spacing: .02em; display: block; }
.brand span { font-size: .66rem; letter-spacing: .2em; opacity: .7; }
.search { display: flex; align-items: center; gap: 8px; background: var(--rail-2); border-radius: 10px; padding: 8px 10px; color: var(--rail-fg); }
.search input { background: none; border: 0; outline: 0; width: 100%; color: #fff; font-size: .9rem; }
.search input::placeholder { color: var(--rail-fg); opacity: .75; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; opacity: .55; padding: 6px 10px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; color: var(--rail-fg); text-decoration: none; font-weight: 500; font-size: .93rem; border: 0; background: none; cursor: pointer; text-align: left; }
.nav-item svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item[aria-current="page"] { background: var(--rail-2); color: #fff; box-shadow: inset 3px 0 0 var(--crimson); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.xp-chip { display: flex; align-items: center; gap: 10px; background: var(--rail-2); border-radius: 12px; padding: 10px 12px; }
.xp-chip .flame { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(240,181,74,.18); color: var(--gold); }
.xp-chip b { color: #fff; font-family: var(--f-mono); }
.theme-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: none; color: var(--rail-fg); padding: 8px; cursor: pointer; font-size: .86rem; }
.theme-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); }

.main { min-width: 0; padding-block: 22px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.crumbs b { color: var(--fg); font-weight: 600; }
.topbar { display: none; }
.tabbar { display: none; }

/* ---------- generic ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-head .eyebrow { display: block; margin-bottom: 6px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 11px; padding: 10px 16px; font-weight: 600; font-size: .92rem; cursor: pointer; text-decoration: none; transition: transform .12s ease, background .15s ease, box-shadow .15s ease; white-space: nowrap; }
.btn svg { width: 17px; height: 17px; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--crimson); color: #fff; box-shadow: 0 6px 16px -8px var(--crimson); }
.btn-primary:hover { background: var(--crimson-ink); }
.btn-ghost { background: var(--surface-2); color: var(--fg); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-quiet { background: none; color: var(--fg); }
.btn-quiet:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn-sm { padding: 6px 11px; font-size: .84rem; border-radius: 9px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.hot { background: var(--crimson-soft); color: var(--crimson); border-color: transparent; }
.chip.gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: .86rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
.input:focus { border-color: var(--crimson); box-shadow: 0 0 0 3px var(--crimson-soft); }
.input.num { font-family: var(--f-mono); }
textarea.input { resize: vertical; min-height: 120px; line-height: 1.55; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

.progress { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--crimson); border-radius: inherit; transition: width .6s cubic-bezier(.2,.8,.2,1); }

.empty { display: grid; place-items: center; text-align: center; gap: 8px; padding: 28px 12px; color: var(--muted); }
.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); font-size: .9rem; }
.note.warn { background: var(--gold-soft); border-color: transparent; }
.note.hot { background: var(--crimson-soft); border-color: transparent; }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 11px; font-weight: 600; font-size: .9rem; opacity: 0; transition: .25s ease; z-index: 90; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; border-radius: 20px; background: var(--rail); color: #fff; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 300px; isolation: isolate; }
.hero-copy { padding: 34px 32px; display: flex; flex-direction: column; gap: 14px; justify-content: center; position: relative; z-index: 2; }
.hero-copy .eyebrow { color: #FF8A99; }
.hero-copy h1 { color: #fff; }
.hero-copy h1 em { font-style: normal; color: #FF8A99; }
.hero-copy p { color: #C9D4E6; max-width: 46ch; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
.hero-readout { position: absolute; right: 18px; top: 16px; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.hero-readout span { font: 500 .78rem/1 var(--f-mono); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); padding: 6px 9px; border-radius: 8px; color: #E3EAF6; }
.hero .btn-ghost { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #fff; }

/* ---------- dashboard ---------- */
.ring { --p: 0; width: 112px; height: 112px; border-radius: 50%; background: conic-gradient(var(--crimson) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; transition: --p .8s; }
.ring > div { width: 86px; height: 86px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; }
.ring b { font: 800 1.5rem/1 var(--f-display); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 700 1.5rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.chap-bars { display: flex; flex-direction: column; gap: 10px; }
.chap-bar { display: grid; grid-template-columns: 26px minmax(0,1fr) 44px; gap: 10px; align-items: center; font-size: .86rem; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.chap-bar .sym { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); font: 700 .8rem/1 var(--f-display); color: var(--crimson); }
.chap-bar .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.chap-bar .t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chap-bar .n { text-align: right; color: var(--muted); font-family: var(--f-mono); font-size: .8rem; }
.tool-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s ease, transform .15s ease; }
.tile:hover { border-color: var(--crimson); transform: translateY(-2px); }
.tile .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--crimson-soft); color: var(--crimson); }
.tile .ico svg { width: 18px; height: 18px; }
.tile b { font-size: .95rem; }
.tile span { font-size: .8rem; color: var(--muted); }

/* ---------- roadmap ---------- */
.road { position: relative; }
.road svg.path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.road-list { position: relative; display: flex; flex-direction: column; gap: 34px; padding: 10px 0; }
.stop { display: grid; grid-template-columns: minmax(0,1fr) 84px minmax(0,1fr); align-items: center; gap: 0; }
.stop .node { justify-self: center; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font: 800 1.45rem/1 var(--f-display); background: var(--surface); color: var(--fg); border: 3px solid var(--line); position: relative; z-index: 1; cursor: pointer; transition: transform .2s ease; }
.stop .node:hover { transform: scale(1.06); }
.stop.done .node { background: var(--good); color: #fff; border-color: var(--good); }
.stop.now .node { background: var(--crimson); color: #fff; border-color: var(--crimson); box-shadow: 0 0 0 8px var(--crimson-soft); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 14px transparent; } }
.stop .info { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.stop .info:hover { border-color: var(--crimson); }
.stop:nth-child(odd) .info { grid-column: 1; grid-row: 1; }
.stop:nth-child(odd) .node { grid-column: 2; grid-row: 1; }
.stop:nth-child(even) .node { grid-column: 2; grid-row: 1; }
.stop:nth-child(even) .info { grid-column: 3; grid-row: 1; }

/* ---------- lessons ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lesson-list { display: flex; flex-direction: column; gap: 16px; }
.chap-block > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 4px 0; }
.chap-block > summary::-webkit-details-marker { display: none; }
.chap-block .sym { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--rail); color: #fff; font: 800 1.05rem/1 var(--f-display); flex: none; }
.lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
.lesson-card { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s ease; }
.lesson-card:hover { border-color: var(--crimson); }
.lesson-card .meta { display: flex; gap: 8px; align-items: center; font-size: .78rem; color: var(--muted); }
.lesson-card p { font-size: .86rem; color: var(--muted); }

.lesson { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 22px; align-items: start; }
.lesson-body { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.lesson-body .prose { display: flex; flex-direction: column; gap: 10px; max-width: 70ch; }
.lesson-aside { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 14px; }
.toc a { display: block; padding: 5px 0; color: var(--muted); text-decoration: none; font-size: .88rem; }
.toc a:hover { color: var(--crimson); }
.formula { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.formula .fhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.formula .fhead b { font-size: .88rem; }
.formula .cond { font-size: .82rem; color: var(--muted); }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); flex: none; }
.icon-btn:hover { color: var(--crimson); border-color: var(--crimson); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.on { color: var(--gold); border-color: var(--gold); }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; align-items: start; animation: rise .35s ease both; }
.step::before { counter-increment: s; content: counter(s); width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--rail); color: #fff; font: 700 .85rem/1 var(--f-mono); }
@keyframes rise { from { opacity: .001; transform: translateY(6px); } }
.mistake { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); }
.mistake svg { width: 18px; height: 18px; color: var(--bad); flex: none; margin-top: 3px; }

/* quiz */
.q { display: flex; flex-direction: column; gap: 12px; }
.q-stem { font-weight: 600; font-size: 1rem; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s ease, background .15s ease; min-width: 0; }
.opt:hover:not([disabled]) { border-color: var(--muted); }
.opt .k { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); font: 700 .8rem/1 var(--f-mono); flex: none; }
.opt[aria-pressed="true"] { border-color: var(--rail-2); background: var(--surface-2); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.feedback { padding: 12px 14px; border-radius: 11px; font-size: .92rem; animation: rise .3s ease both; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 3px; }

/* ---------- calculator ---------- */
.calc { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.calc-menu { display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
.calc-menu .grp { display: flex; flex-direction: column; gap: 2px; }
.calc-menu .grp > span { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; font-weight: 600; }
.calc-menu button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 9px; cursor: pointer; font-size: .9rem; color: var(--fg); }

.plot { width: 100%; height: 230px; display: block; }

.table-wrap { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: .88rem; }
table.data th, table.data td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data th { font-family: var(--f-body); font-weight: 600; color: var(--muted); font-size: .78rem; text-align: right; position: sticky; top: 0; background: var(--surface); }
table.data td:first-child, table.data th:first-child { text-align: left; }

}

    const mean = xs.reduce((s, x, i) => s + x * ns[i], 0) / n;
    const ss = xs.reduce((s, x, i) => s + ns[i] * (x - mean) ** 2, 0);
    const varPop = ss / n, s2 = n > 1 ? ss / (n - 1) : NaN;
    let modeIdx = 0; ns.forEach((v, i) => { if (v > ns[modeIdx]) modeIdx = i; });
    // median from sorted expanded
    const pairs = xs.map((x, i) => [x, ns[i]]).sort((a, b) => a[0] - b[0]);
    const medianAt = k => { let c = 0; for (const [x, f] of pairs) { c += f; if (c >= k) return x; } };
    const median = n % 2 ? medianAt((n + 1) / 2) : (medianAt(n / 2) + medianAt(n / 2 + 1)) / 2;
    const sumx = xs.reduce((s, x, i) => s + x * ns[i], 0), sumx2 = xs.reduce((s, x, i) => s + x * x * ns[i], 0);
    return { n, mean, varPop, s2, s: Math.sqrt(s2), sigmaPop: Math.sqrt(varPop), mode: pairs.length ? xs[modeIdx] : NaN, median, min: pairs[0][0], max: pairs[pairs.length - 1][0], sumx, sumx2 };
  }

  // ---------- estimation ----------
  // method: 'z' (sigma known), 't' (sigma unknown)
  function ciMean({ xbar, sd, n, conf, sigmaKnown }) {
    const alpha = 1 - conf;

  }
  function ciProp({ x, n, f, conf }) {
    if (f == null) f = x / n;
    const z = normInv(1 - (1 - conf) / 2), se = Math.sqrt(f * (1 - f) / n), eps = z * se;
    return { f, crit: z, se, eps, lo: f - eps, hi: f + eps, ok: n * f >= 5 && n * (1 - f) >= 5 };
  }
  function ciVar({ s2, n, conf }) {
    const a = 1 - conf, df = n - 1;
    const cHi = chi2Inv(1 - a / 2, df), cLo = chi2Inv(a / 2, df);
    return { df, chiR: cHi, chiL: cLo, lo: df * s2 / cHi, hi: df * s2 / cLo };
  }
  function sampleSizeMean({ sd, eps, conf }) { const z = normInv(1 - (1 - conf) / 2); const raw = (z * sd / eps) ** 2; return { z, raw, n: Math.ceil(raw - 1e-9) }; }
  function sampleSizeProp({ f = 0.5, eps, conf }) { const z = normInv(1 - (1 - conf) / 2); const raw = z * z * f * (1 - f) / (eps * eps); return { z, raw, n: Math.ceil(raw - 1e-9) }; }

  // ---------- hypothesis tests ----------
  // tail: 'two' | 'left' | 'right'
  function pFromZ(z, tail) { return tail === 'two' ? 2 * (1 - normCdf(Math.abs(z))) : tail === 'left' ? normCdf(z) : 1 - normCdf(z); }
  function pFromT(t, df, tail) { return tail === 'two' ? 2 * (1 - tCdf(Math.abs(t), df)) : tail === 'left' ? tCdf(t, df) : 1 - tCdf(t, df); }
  function critZ(alpha, tail) { return tail === 'two' ? normInv(1 - alpha / 2) : normInv(1 - alpha); }
  function critT(alpha, df, tail) { return tail === 'two' ? invertUpperT(alpha / 2, df) : invertUpperT(alpha, df); }
  function decide(stat, crit, tail) { return tail === 'two' ? Math.abs(stat) > crit : tail === 'left' ? stat < -crit : stat > crit; }

  function testMean({ xbar, mu0, sd, n, alpha, tail, sigmaKnown }) {
    const se = sd / Math.sqrt(n), stat = (xbar - mu0) / se;
    if (sigmaKnown) { const crit = critZ(alpha, tail); return { dist: 'z', stat, se, crit, p: pFromZ(stat, tail), reject: decide(stat, crit, tail) }; }
    const df = n - 1, crit = critT(alpha, df, tail);
    return { dist: 't', df, stat, se, crit, p: pFromT(stat, df, tail), reject: decide(stat, crit, tail) };
  }
  function testProp({ f, x, n, p0, alpha, tail }) {
    if (f == null) f = x / n;
    const se = Math.sqrt(p0 * (1 - p0) / n), stat = (f - p0) / se, crit = critZ(alpha, tail);
    return { dist: 'z', f, stat, se, crit, p: pFromZ(stat, tail), reject: decide(stat, crit, tail) };
  }
  function testVar({ s2, n, sigma0sq, alpha, tail }) {
    const df = n - 1, stat = df * s2 / sigma0sq, cdf = chi2Cdf(stat, df);
    const p = tail === 'two' ? 2 * Math.min(cdf, 1 - cdf) : tail === 'left' ? cdf : 1 - cdf;
    const critL = tail === 'right' ? null : chi2Inv(tail === 'two' ? alpha / 2 : alpha, df);
    const critR = tail === 'left' ? null : chi2Inv(tail === 'two' ? 1 - alpha / 2 : 1 - alpha, df);
    const reject = (critL != null && stat < critL) || (critR != null && stat > critR);
    return { dist: 'chi2', df, stat, p: Math.min(1, p), critL, critR, reject };
  }
  // two means. method: 'z' (sigmas known or large n), 'pooled', 'welch'
  function testTwoMeans({ x1, x2, s1, s2, n1, n2, alpha, tail, method, d0 = 0 }) {
    const diff = x1 - x2 - d0;
    if (method === 'z') { const se = Math.sqrt(s1 * s1 / n1 + s2 * s2 / n2), stat = diff / se, crit = critZ(alpha, tail); return { dist: 'z', se, stat, crit, p: pFromZ(stat, tail), reject: decide(stat, crit, tail) }; }
    if (method === 'pooled') {
      const df = n1 + n2 - 2, sp2 = ((n1 - 1) * s1 * s1 + (n2 - 1) * s2 * s2) / df, se = Math.sqrt(sp2 * (1 / n1 + 1 / n2)), stat = diff / se, crit = critT(alpha, df, tail);
      return { dist: 't', df, sp2, se, stat, crit, p: pFromT(stat, df, tail), reject: decide(stat, crit, tail) };
    }
    const v1 = s1 * s1 / n1, v2 = s2 * s2 / n2, se = Math.sqrt(v1 + v2), df = (v1 + v2) ** 2 / (v1 * v1 / (n1 - 1) + v2 * v2 / (n2 - 1)), stat = diff / se, crit = critT(alpha, df, tail);
    return { dist: 't', df, se, stat, crit, p: pFromT(stat, df, tail), reject: decide(stat, crit, tail) };
  }
  function testPaired({ dbar, sd, n, alpha, tail, d0 = 0 }) { return testMean({ xbar: dbar, mu0: d0, sd, n, alpha, tail, sigmaKnown: false }); }
  function testTwoProps({ x1, n1, x2, n2, alpha, tail }) {
    const f1 = x1 / n1, f2 = x2 / n2, f = (x1 + x2) / (n1 + n2), se = Math.sqrt(f * (1 - f) * (1 / n1 + 1 / n2)), stat = (f1 - f2) / se, crit = critZ(alpha, tail);
    return { dist: 'z', f1, f2, f, se, stat, crit, p: pFromZ(stat, tail), reject: decide(stat, crit, tail) };
  }
  function testTwoVars({ s1, s2, n1, n2, alpha, tail }) {
    const d1 = n1 - 1, d2 = n2 - 1, stat = (s1 * s1) / (s2 * s2), cdf = fCdf(stat, d1, d2);
    const p = tail === 'two' ? 2 * Math.min(cdf, 1 - cdf) : tail === 'left' ? cdf : 1 - cdf;
    const critL = tail === 'right' ? null : fInv(tail === 'two' ? alpha / 2 : alpha, d1, d2);
    const critR = tail === 'left' ? null : fInv(tail === 'two' ? 1 - alpha / 2 : 1 - alpha, d1, d2);
    const reject = (critL != null && stat < critL) || (critR != null && stat > critR);
    return { dist: 'F', d1, d2, stat, p: Math.min(1, p), critL, critR, reject };
  }
  // chi-square independence; table = rows of observed counts
  function chi2Independence(table, alpha) {
    const r = table.length, c = table[0].length, rows = table.map(row => row.reduce((a, b) => a + b, 0));
    const cols = table[0].map((_, j) => table.reduce((s, row) => s + row[j], 0)), N = rows.reduce((a, b) => a + b, 0);
    let stat = 0; const expected = table.map((row, i) => row.map((o, j) => { const e = rows[i] * cols[j] / N; stat += (o - e) ** 2 / e; return e; }));
    const df = (r - 1) * (c - 1), crit = chi2Inv(1 - alpha, df);
    return { dist: 'chi2', df, stat, expected, crit, p: 1 - chi2Cdf(stat, df), reject: stat > crit, minExpected: Math.min(...expected.flat()) };
  }

  return {
    lgamma, normCdf, normPdf, normInv, laplace: z => normCdf(z) - 0.5, ibeta, gammaP,
    tCdf, tPdf, tInv: (p, df) => p < 0.5 ? -invertUpperT(p, df) : invertUpperT(1 - p, df),

    binomPmf, binomCdf, poisPmf, poisCdf, hyperPmf, hyperCdf, geomPmf, geomCdf, discreteProb,

    testMean, testProp, testVar, testTwoMeans, testPaired, testTwoProps, testTwoVars, chi2Independence, critZ, critT
  };
})();

    R`$A$ và $B$ **độc lập** khi việc $B$ xảy ra không làm thay đổi xác suất của $A$: $P(A\mid B)=P(A)$, tương đương $P(AB)=P(A)P(B)$.`,
    R`Nếu $A$, $B$ độc lập thì các cặp $(\bar A,B)$, $(A,\bar B)$, $(\bar A,\bar B)$ cũng độc lập.`,
    R`Hai biến cố xung khắc có xác suất dương thì **không** độc lập: biết $B$ xảy ra thì $A$ chắc chắn không xảy ra.`
  ],
  formulas: [
    { name: 'Tiêu chuẩn độc lập', tex: R`P(AB)=P(A)\,P(B)`, cond: 'Áp dụng cho các thiết bị, lần bắn, phép thử hoạt động riêng rẽ.' },
    { name: 'Ít nhất một (độc lập)', tex: R`P(A_1+\dots+A_n)=1-\prod_{i=1}^{n}\bigl(1-P(A_i)\bigr)`, cond: 'Các Aᵢ độc lập toàn phần.' }
  ],
  example: { q: R`Hai máy hoạt động độc lập, xác suất hỏng trong ngày lần lượt là 0,1 và 0,2. Tính xác suất có ít nhất một máy chạy, và cả hai máy cùng chạy.`,
    steps: [R`Ít nhất một máy chạy là đối của "cả hai cùng hỏng": $1-0,1\cdot 0,2=0,98$.`, R`Cả hai cùng chạy: $0,9\cdot 0,8=0,72$.`],
    ans: R`0,98 và 0,72.` },
  mistakes: [R`Nghĩ xung khắc nghĩa là độc lập. Thực tế xung khắc (với xác suất dương) kéo theo phụ thuộc.`],
  quiz: [
    { q: R`$A$, $B$ độc lập, $P(A)=0,4$; $P(B)=0,5$. Tính $P(A+B)$.`, o: ['0,9', '0,7', '0,2', '0,8'], a: 1, why: R`$0,4+0,5-0,4\cdot0,5=0,7$.` },
    { q: R`$A$, $B$ xung khắc và đều có xác suất dương. Khi đó:`, o: ['A, B độc lập', 'A, B không độc lập', 'P(A+B) = P(A)P(B)', 'P(AB) = P(A)P(B)'], a: 1, why: R`$P(AB)=0\neq P(A)P(B)>0$.` }
  ] },

{ id: 'c1b6', ch: 1, title: 'Công thức xác suất đầy đủ và Bayes', mins: 14,
  summary: 'Lập sơ đồ cây theo hệ đầy đủ và cập nhật xác suất khi biết kết quả.',
  core: [
    R`Hệ $H_1,\dots,H_n$ là **hệ đầy đủ** nếu chúng xung khắc từng đôi và $\sum P(H_i)=1$. Trong bài toán nhà máy, $H_i$ thường là "sản phẩm do phân xưởng $i$ làm ra".`,
    R`Công thức đầy đủ trả lời câu hỏi "trước khi biết kết quả". Công thức **Bayes** trả lời "sau khi đã biết $A$ xảy ra, nguyên nhân là $H_k$ với xác suất bao nhiêu".`,
    R`Mẹo nhận dạng: đề cho "lấy được phế phẩm, tính xác suất phế phẩm đó của máy 2" là Bayes.`
  ],
  formulas: [
    { name: 'Xác suất đầy đủ', tex: R`P(A)=\sum_{i=1}^{n}P(H_i)\,P(A\mid H_i)`, cond: 'Các Hᵢ phải lập thành hệ đầy đủ.' },
    { name: 'Công thức Bayes', tex: R`P(H_k\mid A)=\dfrac{P(H_k)\,P(A\mid H_k)}{P(A)}`, cond: 'Mẫu số là P(A) tính bằng công thức đầy đủ.' }
  ],
  example: { q: R`Phân xưởng A làm 60% sản phẩm với tỷ lệ phế phẩm 3%; phân xưởng B làm 40% với tỷ lệ phế phẩm 5%. Lấy ngẫu nhiên một sản phẩm thấy là phế phẩm. Tính xác suất nó do B làm ra.`,
    steps: [R`Hệ đầy đủ: $P(H_A)=0,6$; $P(H_B)=0,4$.`, R`$P(F)=0,6\cdot0,03+0,4\cdot0,05=0,018+0,020=0,038$.`, R`$P(H_B\mid F)=\dfrac{0,020}{0,038}\approx 0,5263$.`],
    ans: R`$\approx 0,5263$. B làm ít sản phẩm hơn nhưng chiếm hơn nửa số phế phẩm.` },
  mistakes: [R`Trả lời $P(F\mid H_B)=0,05$ thay vì $P(H_B\mid F)$.`, R`Quên kiểm tra $\sum P(H_i)=1$ trước khi áp dụng.`],
  quiz: [
    { q: R`Ba máy làm 50%, 30%, 20% sản phẩm với tỷ lệ phế phẩm 1%, 2%, 3%. Tỷ lệ phế phẩm chung là:`, o: ['0,02', '0,017', '0,06', '0,015'], a: 1, why: R`$0,005+0,006+0,006=0,017$.` },
    { q: R`Cùng đề trên, lấy được phế phẩm. Xác suất nó do máy 3 làm ra xấp xỉ:`, o: ['0,20', '0,3529', '0,03', '0,5'], a: 1, why: R`$0,006/0,017\approx0,3529$.` }
  ] },

{ id: 'c1b7', ch: 1, title: 'Công thức Bernoulli', mins: 10,
  summary: 'Tính xác suất có đúng k lần thành công trong n phép thử độc lập giống nhau.',
  core: [
    R`Lược đồ Bernoulli gồm $n$ phép thử **độc lập**, mỗi phép thử chỉ có hai kết quả (thành công/thất bại) và xác suất thành công $p$ **không đổi**.`,
    R`Số lần thành công có khả năng nhất $k_0$ thỏa $(n+1)p-1\le k_0\le (n+1)p$.`
  ],
  formulas: [
    { name: 'Công thức Bernoulli', tex: R`P_n(k)=C_n^k\,p^k\,q^{\,n-k},\quad q=1-p`, cond: 'Phép thử độc lập, p không đổi (lấy có hoàn lại hoặc tổng thể rất lớn).' },
    { name: 'Số có khả năng nhất', tex: R`(n+1)p-1\ \le\ k_0\ \le\ (n+1)p`, cond: 'k₀ nguyên.' }
  ],
  example: { q: R`Bài thi có 10 câu trắc nghiệm, mỗi câu 4 phương án. Một sinh viên chọn bừa tất cả. Tính xác suất đúng đúng 5 câu.`,
    steps: [R`$n=10$, $p=0,25$, $q=0,75$.`, R`$P_{10}(5)=C_{10}^5\,(0,25)^5(0,75)^5=252\cdot 0,0009766\cdot 0,2373$.`, R`$\approx 0,0584$.`],
    ans: R`$\approx 0,0584$.` },
  mistakes: [R`Dùng Bernoulli khi lấy không hoàn lại từ tổng thể nhỏ. Trường hợp đó phải dùng phân phối siêu bội.`, R`Quên hệ số $C_n^k$.`],
  quiz: [
    { q: R`Tung đồng xu cân đối 4 lần. Xác suất được đúng 2 mặt ngửa:`, o: ['0,25', '0,375', '0,5', '0,0625'], a: 1, why: R`$C_4^2(0,5)^4=6/16=0,375$.` },
    { q: R`Với $n=10$, $p=0,25$, số lần thành công có khả năng nhất là:`, o: ['2', '3', '2,5', '1'], a: 0, why: R`$(n+1)p=2,75$ nên $1,75\le k_0\le2,75$, vậy $k_0=2$.` }
  ], tool: 'binom' },

/* ================= CHƯƠNG 2 ================= */
{ id: 'c2b1', ch: 2, title: 'Biến ngẫu nhiên và phân loại', mins: 8,
  summary: 'Phân biệt biến ngẫu nhiên rời rạc và liên tục.',
  core: [
    R`**Biến ngẫu nhiên** $X$ gán cho mỗi kết quả của phép thử một con số.`,
    R`$X$ **rời rạc** nếu tập giá trị đếm được (số lần, số sản phẩm, số khách). $X$ **liên tục** nếu giá trị lấp đầy một khoảng (thời gian, chiều cao, trọng lượng).`
  ],
  formulas: [{ name: 'Ký hiệu', tex: R`X:\Omega\to\mathbb{R},\quad \{X=x\},\ \{X<x\}\ \text{là các biến cố}`, cond: 'Biến ngẫu nhiên viết hoa, giá trị viết thường.' }],
  example: { q: R`Phân loại: số chấm khi gieo xúc xắc; thời gian chờ xe buýt.`, steps: [R`Số chấm nhận các giá trị 1 đến 6: rời rạc.`, R`Thời gian chờ có thể là bất kỳ số nào trong một khoảng: liên tục.`], ans: 'Rời rạc và liên tục.' },
  mistakes: [R`Dựa vào đơn vị đo để phân loại. Hãy hỏi: giá trị có đếm được từng cái không?`],
  quiz: [
    { q: 'Chiều cao của một sinh viên chọn ngẫu nhiên là biến ngẫu nhiên:', o: ['Rời rạc', 'Liên tục', 'Không phải BNN', 'Hằng số'], a: 1, why: 'Chiều cao nhận giá trị trong một khoảng số thực.' },
    { q: 'Số khách vào cửa hàng trong một giờ là biến ngẫu nhiên:', o: ['Rời rạc', 'Liên tục', 'Chuẩn', 'Đều'], a: 0, why: 'Số khách là số nguyên đếm được.' }
  ] },

{ id: 'c2b2', ch: 2, title: 'Bảng phân phối xác suất', mins: 10,
  summary: 'Lập bảng phân phối của biến ngẫu nhiên rời rạc và kiểm tra tính hợp lệ.',
  core: [
    R`Bảng phân phối liệt kê các giá trị $x_i$ và xác suất $p_i=P(X=x_i)$ tương ứng.`,
    R`Bảng hợp lệ khi mọi $p_i\ge 0$ và $\sum p_i=1$. Luôn cộng lại để kiểm tra.`
  ],
  formulas: [{ name: 'Điều kiện', tex: R`p_i\ge0,\qquad \sum_i p_i=1`, cond: 'Dùng để tìm tham số chưa biết trong bảng.' }],
  example: { q: R`Hộp có 3 bi đỏ và 2 bi xanh. Lấy ngẫu nhiên 2 bi. Gọi $X$ là số bi đỏ. Lập bảng phân phối.`,
    steps: [R`$C_5^2=10$ cách.`, R`$P(X=0)=C_2^2/10=0,1$; $P(X=1)=C_3^1C_2^1/10=0,6$; $P(X=2)=C_3^2/10=0,3$.`, R`Kiểm tra: $0,1+0,6+0,3=1$.`],
    ans: R`$X$: 0, 1, 2 với xác suất 0,1; 0,6; 0,3.` },
  mistakes: [R`Không kiểm tra tổng xác suất bằng 1, nên bỏ sót một giá trị của $X$.`],
  quiz: [
    { q: R`Bảng: $X=0,1,2$ với xác suất $0,2;\ a;\ 0,5$. Giá trị của $a$ là:`, o: ['0,2', '0,3', '0,5', '0,7'], a: 1, why: R`$a=1-0,2-0,5=0,3$.` },
    { q: R`Với bảng ở ví dụ (0,1; 0,6; 0,3), $P(X\ge1)$ bằng:`, o: ['0,6', '0,9', '0,3', '1'], a: 1, why: R`$0,6+0,3=0,9$.` }
  ] },

{ id: 'c2b3', ch: 2, title: 'Hàm phân phối xác suất', mins: 12,
  summary: 'Đọc và dùng hàm phân phối F(x), chú ý quy ước dấu < hay ≤ của giáo trình.',
  core: [
    R`Nhiều giáo trình Việt Nam định nghĩa $F(x)=P(X<x)$, còn tài liệu quốc tế dùng $F(x)=P(X\le x)$. Với biến liên tục hai cách cho cùng kết quả. Với biến rời rạc, hãy theo quy ước của giáo trình bạn học.`,
    R`$F$ không giảm, $F(-\infty)=0$, $F(+\infty)=1$. Với biến rời rạc, $F$ là hàm bậc thang nhảy tại các $x_i$.`
  ],
  formulas: [
    { name: 'Định nghĩa (giáo trình VN)', tex: R`F(x)=P(X<x)`, cond: 'Tài liệu quốc tế: F(x) = P(X ≤ x).' },
    { name: 'Xác suất trong khoảng', tex: R`P(a\le X<b)=F(b)-F(a)`, cond: 'Với biến liên tục, dấu bằng ở hai đầu không ảnh hưởng.' }
  ],
  example: { q: R`Với $X$ có bảng 0, 1, 2 và xác suất 0,1; 0,6; 0,3, viết $F(x)=P(X<x)$.`,
    steps: [R`$x\le0$: $F=0$.`, R`$0<x\le1$: $F=0,1$.`, R`$1<x\le2$: $F=0,7$.`, R`$x>2$: $F=1$.`],
    ans: 'Hàm bậc thang nhảy tại 0, 1, 2.' },
  mistakes: [R`Trộn quy ước $<$ và $\le$ giữa giáo trình và đáp án.`],
  quiz: [
    { q: R`Với $X$ liên tục, $P(X=a)$ bằng:`, o: ['F(a)', '0', 'f(a)', '1'], a: 1, why: 'Một điểm đơn lẻ có xác suất 0 với biến liên tục.' },
    { q: R`Theo quy ước $F(x)=P(X<x)$, $F(b)-F(a)$ bằng:`, o: ['P(a < X < b)', 'P(a ≤ X < b)', 'P(a < X ≤ b)', 'P(a ≤ X ≤ b)'], a: 1, why: R`$P(X<b)-P(X<a)=P(a\le X<b)$.` }
  ] },

{ id: 'c2b4', ch: 2, title: 'Biến ngẫu nhiên liên tục và hàm mật độ', mins: 12,
  summary: 'Tìm hằng số chuẩn hóa và tính xác suất bằng tích phân hàm mật độ.',
  core: [
    R`Hàm mật độ $f(x)$ cho biết xác suất "dày" đến đâu quanh $x$. Xác suất là **diện tích** dưới đường $f$.`,
    R`$f(x)$ không phải xác suất và có thể lớn hơn 1. Điều bắt buộc là $f\ge0$ và tổng diện tích bằng 1.`
  ],
  formulas: [
    { name: 'Điều kiện mật độ', tex: R`f(x)\ge0,\qquad \int_{-\infty}^{+\infty}f(x)\,dx=1`, cond: 'Dùng để tìm hằng số k.' },
    { name: 'Xác suất', tex: R`P(a<X<b)=\int_a^b f(x)\,dx=F(b)-F(a)`, cond: '' }
  ],
  example: { q: R`$f(x)=kx^2$ trên $[0;3]$, bằng 0 ở ngoài. Tìm $k$ và $P(1<X<2)$.`,
    steps: [R`$\int_0^3 kx^2dx=9k=1\Rightarrow k=1/9$.`, R`$P(1<X<2)=\frac19\cdot\frac{x^3}{3}\Big|_1^2=\frac{8-1}{27}=\frac{7}{27}\approx0,2593$.`],
    ans: R`$k=1/9$; $P\approx0,2593$.` },
  mistakes: [R`Hiểu $f(2)$ là $P(X=2)$.`, R`Quên rằng ngoài khoảng xác định thì $f=0$ khi lấy tích phân.`],
  quiz: [
    { q: R`$f(x)=kx$ trên $[0;2]$. Giá trị $k$ là:`, o: ['1', '1/2', '2', '1/4'], a: 1, why: R`$\int_0^2kx\,dx=2k=1$.` },
    { q: R`$f(x)=2x$ trên $[0;1]$. $P(X<0,5)$ bằng:`, o: ['0,5', '0,25', '0,75', '1'], a: 1, why: R`$\int_0^{0,5}2x\,dx=0,25$.` }
  ] },

{ id: 'c2b5', ch: 2, title: 'Kỳ vọng', mins: 10,
  summary: 'Tính giá trị trung bình dài hạn của biến ngẫu nhiên và dùng tính chất tuyến tính.',
  core: [
    R`Kỳ vọng $E(X)$ là trung bình có trọng số của các giá trị, trọng số là xác suất. Lặp phép thử rất nhiều lần, trung bình các giá trị quan sát tiến về $E(X)$.`,
    R`Kỳ vọng tuyến tính: $E(aX+b)=aE(X)+b$ và $E(X+Y)=E(X)+E(Y)$ luôn đúng. $E(XY)=E(X)E(Y)$ chỉ đúng khi $X,Y$ độc lập.`
  ],
  formulas: [
    { name: 'Rời rạc / liên tục', tex: R`E(X)=\sum_i x_ip_i,\qquad E(X)=\int x\,f(x)\,dx`, cond: '' },
    { name: 'Tính chất', tex: R`E(aX+b)=aE(X)+b`, cond: 'E(XY) = E(X)E(Y) chỉ khi X, Y độc lập.' }
  ],
  example: { q: R`Với $X$ có bảng 0, 1, 2 và xác suất 0,1; 0,6; 0,3, tính $E(X)$.`, steps: [R`$E(X)=0\cdot0,1+1\cdot0,6+2\cdot0,3=1,2$.`], ans: R`$E(X)=1,2$.` },
  mistakes: [R`Áp dụng $E(XY)=E(X)E(Y)$ khi chưa có giả thiết độc lập.`],
  quiz: [
    { q: R`$E(X)=3$. Tính $E(2X+5)$.`, o: ['6', '11', '8', '13'], a: 1, why: R`$2\cdot3+5=11$.` },
    { q: R`$f(x)=2x$ trên $[0;1]$. $E(X)$ bằng:`, o: ['1/2', '2/3', '1/3', '1'], a: 1, why: R`$\int_0^1 2x^2dx=2/3$.` }
  ] },

{ id: 'c2b6', ch: 2, title: 'Phương sai và độ lệch chuẩn', mins: 12,
  summary: 'Đo mức độ phân tán quanh kỳ vọng, và tránh các lỗi về hệ số.',
  core: [
    R`Phương sai $V(X)=E\bigl[(X-EX)^2\bigr]$ đo độ phân tán. Độ lệch chuẩn $\sigma=\sqrt{V(X)}$ có cùng đơn vị với $X$.`,
    R`Hằng số cộng thêm không làm thay đổi độ phân tán; hệ số nhân bị **bình phương**.`
  ],
  formulas: [
    { name: 'Công thức tính', tex: R`V(X)=E(X^2)-\bigl[E(X)\bigr]^2`, cond: '' },
    { name: 'Tính chất', tex: R`V(aX+b)=a^2V(X),\qquad V(X\pm Y)=V(X)+V(Y)`, cond: 'Công thức thứ hai cần X, Y độc lập. Luôn cộng, kể cả với X − Y.' }
  ],
  example: { q: R`Với $X$ có bảng 0, 1, 2 và xác suất 0,1; 0,6; 0,3, tính $V(X)$ và $\sigma$.`,
    steps: [R`$E(X^2)=0+1\cdot0,6+4\cdot0,3=1,8$.`, R`$V(X)=1,8-1,2^2=0,36$.`, R`$\sigma=0,6$.`], ans: R`$V=0,36$; $\sigma=0,6$.` },
  mistakes: [R`Viết $V(2X)=2V(X)$. Đúng là $4V(X)$.`, R`Viết $V(X-Y)=V(X)-V(Y)$. Đúng là cộng.`],
  quiz: [
    { q: R`$V(X)=4$. Tính $V(3X-1)$.`, o: ['11', '12', '36', '35'], a: 2, why: R`$9\cdot4=36$.` },
    { q: R`$X,Y$ độc lập, $V(X)=2$, $V(Y)=3$. $V(X-Y)$ bằng:`, o: ['−1', '1', '5', '6'], a: 2, why: R`$2+3=5$.` }
  ] },

{ id: 'c2b7', ch: 2, title: 'Mode, trung vị và phân vị', mins: 10,
  summary: 'Tìm giá trị có khả năng nhất và điểm chia đôi xác suất.',
  core: [
    R`**Mode** là giá trị có xác suất lớn nhất (rời rạc) hoặc làm $f(x)$ đạt cực đại (liên tục).`,
    R`**Trung vị** $m$ thỏa $F(m)=0,5$: một nửa xác suất nằm mỗi bên. **Phân vị** mức $p$ là $x_p$ với $F(x_p)=p$.`
  ],
  formulas: [{ name: 'Trung vị (liên tục)', tex: R`\int_{-\infty}^{m}f(x)\,dx=0,5`, cond: '' }],
  example: { q: R`$f(x)=2x$ trên $[0;1]$. Tìm mode và trung vị.`, steps: [R`$f$ tăng trên $[0;1]$ nên mode là $x=1$.`, R`$F(x)=x^2=0,5\Rightarrow m=\sqrt{0,5}\approx0,7071$.`], ans: R`Mode $=1$; trung vị $\approx0,7071$.` },
  mistakes: [R`Nhầm mode với kỳ vọng. Ba đại lượng mode, trung vị, kỳ vọng chỉ trùng nhau khi phân phối đối xứng một đỉnh.`],
  quiz: [
    { q: R`$X$ nhận 1, 2, 3 với xác suất 0,2; 0,5; 0,3. Mode của $X$ là:`, o: ['1', '2', '3', '0,5'], a: 1, why: 'Giá trị 2 có xác suất lớn nhất (0,5).' },
    { q: R`Trung vị $m$ của biến liên tục thỏa:`, o: ['f(m) = 0,5', 'F(m) = 0,5', 'E(X) = m', 'f(m) lớn nhất'], a: 1, why: R`Định nghĩa: $F(m)=0,5$.` }
  ] },

/* ================= CHƯƠNG 3 ================= */
{ id: 'c3b1', ch: 3, title: 'Phân phối nhị thức', mins: 12,
  summary: 'Nhận diện phân phối nhị thức B(n, p) và tính xác suất, kỳ vọng, phương sai.',
  core: [
    R`$X\sim B(n,p)$ là số lần thành công trong lược đồ Bernoulli $n$ phép thử với xác suất $p$.`,
    R`Từ khóa thường gặp: "kiểm tra $n$ sản phẩm, tỷ lệ phế phẩm $p$" (khi lô rất lớn hoặc lấy có hoàn lại), "bắn $n$ phát độc lập".`
  ],
  formulas: [
    { name: 'Xác suất', tex: R`P(X=k)=C_n^k\,p^k\,q^{\,n-k}`, cond: 'k = 0, 1, …, n.' },
    { name: 'Đặc trưng', tex: R`E(X)=np,\quad V(X)=npq`, cond: '' }
  ],
  example: { q: R`Tỷ lệ phế phẩm của một dây chuyền là 5%. Kiểm tra 20 sản phẩm. Tính xác suất có nhiều nhất 1 phế phẩm.`,
    steps: [R`$X\sim B(20;0,05)$.`, R`$P(X\le1)=0,95^{20}+20\cdot0,05\cdot0,95^{19}$.`, R`$\approx0,3585+0,3774=0,7358$.`], ans: R`$\approx0,7358$; $E(X)=1$, $V(X)=0,95$.` },
  mistakes: [R`"Nhiều nhất 1" là $X\le1$, gồm cả $X=0$.`, R`Dùng nhị thức khi lấy không hoàn lại từ lô nhỏ.`],
  quiz: [
    { q: R`$X\sim B(10;0,3)$. $E(X)$ và $V(X)$ lần lượt là:`, o: ['3 và 2,1', '3 và 0,21', '0,3 và 2,1', '3 và 7'], a: 0, why: R`$np=3$, $npq=2,1$.` },
    { q: R`$X\sim B(5;0,5)$. $P(X=5)$ bằng:`, o: ['0,5', '0,1', '0,03125', '0,15625'], a: 2, why: R`$0,5^5=1/32$.` }
  ], tool: 'binom' },

{ id: 'c3b2', ch: 3, title: 'Phân phối siêu bội', mins: 12,
  summary: 'Tính xác suất khi lấy không hoàn lại từ tổng thể hữu hạn.',
  core: [
    R`Tổng thể có $N$ phần tử, trong đó $M$ phần tử có tính chất cần quan tâm. Lấy **không hoàn lại** $n$ phần tử. $X$ là số phần tử có tính chất đó: $X\sim H(N,M,n)$.`,
    R`Khi $n$ rất nhỏ so với $N$ (thường $n/N<0,05$), có thể xấp xỉ bằng $B(n,\,M/N)$.`
  ],
  formulas: [
    { name: 'Xác suất', tex: R`P(X=k)=\dfrac{C_M^k\,C_{N-M}^{\,n-k}}{C_N^n}`, cond: 'Lấy không hoàn lại.' },
    { name: 'Đặc trưng', tex: R`E(X)=np,\quad V(X)=npq\,\dfrac{N-n}{N-1},\quad p=\dfrac MN`, cond: 'Hệ số (N − n)/(N − 1) là hệ số hiệu chỉnh tổng thể hữu hạn.' }
  ],
  example: { q: R`Lô hàng 20 sản phẩm có 4 phế phẩm. Lấy ngẫu nhiên 5 sản phẩm. Tính xác suất có đúng 1 phế phẩm.`,
    steps: [R`$X\sim H(20,4,5)$.`, R`$P(X=1)=\dfrac{C_4^1C_{16}^4}{C_{20}^5}=\dfrac{4\cdot1820}{15504}$.`, R`$\approx0,4696$.`], ans: R`$\approx0,4696$; $E(X)=1$.` },
  mistakes: [R`Dùng nhị thức $B(5;0,2)$ cho đề này. Kết quả 0,4096 sai đáng kể vì $n/N=0,25$.`],
  quiz: [
    { q: R`$X\sim H(10,4,3)$. $P(X=0)$ bằng:`, o: ['1/6', '0,216', '1/2', '1/10'], a: 0, why: R`$C_6^3/C_{10}^3=20/120$.` },
    { q: R`$X\sim H(10,4,3)$. $E(X)$ bằng:`, o: ['1,2', '0,4', '3', '4'], a: 0, why: R`$np=3\cdot0,4=1,2$.` }
  ], tool: 'hyper' },

{ id: 'c3b3', ch: 3, title: 'Phân phối Poisson', mins: 12,
  summary: 'Mô hình số sự kiện hiếm trong một khoảng thời gian hay không gian.',
  core: [
    R`$X\sim P(\lambda)$ đếm số lần một sự kiện xảy ra trong một khoảng, khi các sự kiện xảy ra độc lập với tốc độ trung bình không đổi.`,
    R`$\lambda$ **tỷ lệ với độ dài khoảng**: 3 cuộc gọi/phút thì trong 2 phút có $\lambda=6$.`
  ],
  formulas: [
    { name: 'Xác suất', tex: R`P(X=k)=e^{-\lambda}\dfrac{\lambda^k}{k!}`, cond: 'k = 0, 1, 2, …' },
    { name: 'Đặc trưng', tex: R`E(X)=V(X)=\lambda`, cond: '' }
  ],
  example: { q: R`Tổng đài nhận trung bình 3 cuộc gọi mỗi phút. Tính xác suất có đúng 2 cuộc gọi trong một phút, và có ít nhất 1 cuộc gọi trong 2 phút.`,
    steps: [R`Một phút: $\lambda=3$, $P(X=2)=e^{-3}\cdot 9/2\approx0,2240$.`, R`Hai phút: $\lambda=6$, $P(Y\ge1)=1-e^{-6}\approx0,9975$.`], ans: R`$\approx0,2240$ và $\approx0,9975$.` },
  mistakes: [R`Giữ nguyên $\lambda$ khi đề đổi khoảng thời gian.`],
  quiz: [
    { q: R`$X\sim P(2)$. $P(X=0)$ xấp xỉ:`, o: ['0,1353', '0,2707', '0,8647', '0'], a: 0, why: R`$e^{-2}\approx0,1353$.` },
    { q: R`Trung bình 4 khách mỗi 10 phút. Trong 30 phút, $\lambda$ bằng:`, o: ['4', '12', '1,33', '40'], a: 1, why: R`$4\cdot3=12$.` }
  ], tool: 'poisson' },

{ id: 'c3b4', ch: 3, title: 'Phân phối chuẩn', mins: 15,
  summary: 'Chuẩn hóa về Z, tra Φ hoặc hàm Laplace, và dùng quy tắc 3σ.',
  core: [
    R`$X\sim N(\mu,\sigma^2)$ có đồ thị hình chuông đối xứng quanh $\mu$. Chú ý: tham số thứ hai là **phương sai**. $N(65;100)$ nghĩa là $\sigma=10$.`,
    R`Mọi bài chuẩn quy về $Z=(X-\mu)/\sigma\sim N(0,1)$. Giáo trình có thể dùng hàm tích lũy $\Phi(z)$ hoặc hàm Laplace $\varphi_0(z)=\Phi(z)-0,5$. Máy tính của trang hỗ trợ cả hai.`,
    R`Quy tắc $3\sigma$: khoảng $\mu\pm\sigma$, $\mu\pm2\sigma$, $\mu\pm3\sigma$ chứa lần lượt khoảng 68,27%, 95,45%, 99,73% xác suất.`
  ],
  formulas: [
    { name: 'Chuẩn hóa', tex: R`P(a<X<b)=\Phi\!\left(\tfrac{b-\mu}{\sigma}\right)-\Phi\!\left(\tfrac{a-\mu}{\sigma}\right)`, cond: 'Với hàm Laplace: thay Φ bằng φ₀, kết quả như nhau.' },
    { name: 'Tính đối xứng', tex: R`\Phi(-z)=1-\Phi(z),\qquad \varphi_0(-z)=-\varphi_0(z)`, cond: 'Bảng thường chỉ cho z ≥ 0.' }
  ],
  example: { q: R`Điểm thi $X\sim N(65;10^2)$. Tính $P(X>80)$ và $P(50<X<80)$.`,
    steps: [R`$z=(80-65)/10=1,5$.`, R`$P(X>80)=1-\Phi(1,5)\approx1-0,9332=0,0668$.`, R`$P(50<X<80)=\Phi(1,5)-\Phi(-1,5)=2\Phi(1,5)-1\approx0,8664$.`], ans: R`0,0668 và 0,8664.` },
  mistakes: [R`Nhập phương sai vào ô $\sigma$ (gõ 100 thay vì 10).`, R`Lẫn $\Phi$ và $\varphi_0$, làm kết quả lệch đúng 0,5.`],
  quiz: [
    { q: R`$Z\sim N(0,1)$. $P(Z<1,96)$ xấp xỉ:`, o: ['0,95', '0,975', '0,4750', '0,05'], a: 1, why: R`$\Phi(1,96)\approx0,975$.` },
    { q: R`$X\sim N(100;16)$. $P(X>108)$ xấp xỉ:`, o: ['0,0228', '0,0013', '0,1587', '0,4772'], a: 0, why: R`$\sigma=4$, $z=2$, $1-\Phi(2)\approx0,0228$.` }
  ], tool: 'normal' },

{ id: 'c3b5', ch: 3, title: 'Phân phối đều và phân phối mũ', mins: 12,
  summary: 'Thời gian chờ ngẫu nhiên đều và tuổi thọ không nhớ.',
  core: [
    R`$X\sim U(a,b)$: mọi đoạn cùng độ dài trong $[a,b]$ có cùng xác suất. Ví dụ thời gian chờ xe buýt chạy 10 phút một chuyến.`,
    R`$X\sim \text{Exp}(\lambda)$ mô hình thời gian chờ đến sự kiện đầu tiên, tuổi thọ thiết bị. Tính **không nhớ**: $P(X>s+t\mid X>s)=P(X>t)$.`,
    R`Chú ý $\lambda=1/E(X)$. Tuổi thọ trung bình 5 năm thì $\lambda=0,2$.`
  ],
  formulas: [
    { name: 'Đều', tex: R`f(x)=\dfrac{1}{b-a},\quad E=\dfrac{a+b}{2},\quad V=\dfrac{(b-a)^2}{12}`, cond: 'x ∈ [a, b].' },
    { name: 'Mũ', tex: R`f(x)=\lambda e^{-\lambda x},\quad P(X>t)=e^{-\lambda t},\quad E=\dfrac1\lambda,\ V=\dfrac1{\lambda^2}`, cond: 'x ≥ 0.' }
  ],
  example: { q: R`Tuổi thọ thiết bị có phân phối mũ với trung bình 5 năm. Tính xác suất thiết bị dùng được hơn 3 năm.`, steps: [R`$\lambda=1/5=0,2$.`, R`$P(X>3)=e^{-0,6}\approx0,5488$.`], ans: R`$\approx0,5488$.` },
  mistakes: [R`Dùng $\lambda=5$ thay vì $\lambda=1/5$.`],
  quiz: [
    { q: R`$X\sim U(2;8)$. $E(X)$ và $V(X)$ là:`, o: ['5 và 3', '5 và 36', '4 và 3', '5 và 6'], a: 0, why: R`$(2+8)/2=5$; $36/12=3$.` },
    { q: R`Phân phối mũ trung bình 4. $P(X>4)$ xấp xỉ:`, o: ['0,3679', '0,6321', '0,25', '0,0183'], a: 0, why: R`$e^{-1}\approx0,3679$.` }
  ], tool: 'expo' },

{ id: 'c3b6', ch: 3, title: 'Xấp xỉ phân phối', mins: 14,
  summary: 'Xấp xỉ nhị thức bằng Poisson hoặc chuẩn, và hiệu chỉnh liên tục.',
  core: [
    R`**Nhị thức → Poisson**: khi $n$ lớn và $p$ nhỏ (thường $n\ge50$, $p\le0,1$), dùng $\lambda=np$.`,
    R`**Nhị thức → chuẩn**: khi $np\ge5$ và $nq\ge5$, dùng $N(np,\,npq)$. Vì đổi từ rời rạc sang liên tục, cộng/trừ 0,5 (**hiệu chỉnh liên tục**).`,
    R`Máy tính XSTK cho phép so sánh kết quả chính xác và kết quả xấp xỉ để thấy sai số.`
  ],
  formulas: [
    { name: 'Hiệu chỉnh liên tục', tex: R`P(X\le k)\approx\Phi\!\left(\dfrac{k+0,5-np}{\sqrt{npq}}\right)`, cond: 'np ≥ 5 và nq ≥ 5.' },
    { name: 'Xấp xỉ Poisson', tex: R`C_n^kp^kq^{n-k}\approx e^{-np}\dfrac{(np)^k}{k!}`, cond: 'n lớn, p nhỏ.' }
  ],
  example: { q: R`$X\sim B(100;0,5)$. Tính $P(X\le55)$ chính xác và xấp xỉ chuẩn.`,
    steps: [R`$np=50$, $\sqrt{npq}=5$.`, R`Xấp xỉ: $\Phi\bigl((55,5-50)/5\bigr)=\Phi(1,1)\approx0,8643$.`, R`Chính xác (máy tính): $0,8644$. Nếu bỏ hiệu chỉnh, $\Phi(1)=0,8413$, sai số lớn hơn nhiều.`], ans: R`$\approx0,8643$.` },
  mistakes: [R`Quên hiệu chỉnh 0,5.`, R`Xấp xỉ chuẩn khi $np<5$.`],
  quiz: [
    { q: R`$X\sim B(200;0,01)$. Xấp xỉ Poisson dùng $\lambda$ bằng:`, o: ['0,01', '2', '200', '1,98'], a: 1, why: R`$\lambda=np=2$.` },
    { q: R`Với xấp xỉ chuẩn, $P(X=50)$ được tính bằng:`, o: ['Φ((50 − np)/σ)', 'Φ((50,5 − np)/σ) − Φ((49,5 − np)/σ)', '0', 'f(50)'], a: 1, why: 'Một giá trị nguyên tương ứng với khoảng [49,5; 50,5].' }
  ], tool: 'binom' },

/* ================= CHƯƠNG 4 ================= */
{ id: 'c4b1', ch: 4, title: 'Tổng thể và mẫu', mins: 8,
  summary: 'Phân biệt tham số của tổng thể với thống kê tính từ mẫu.',
  core: [
    R`**Tổng thể** là toàn bộ đối tượng nghiên cứu, kích thước $N$. **Mẫu** là $n$ phần tử được chọn ra.`,
    R`**Tham số** ($\mu$, $\sigma^2$, $p$) là con số cố định nhưng thường chưa biết. **Thống kê** ($\bar x$, $s^2$, $f$) tính từ mẫu, thay đổi theo mẫu, nên là biến ngẫu nhiên.`
  ],
  formulas: [{ name: 'Ký hiệu', tex: R`\mu\leftrightarrow\bar x,\qquad \sigma^2\leftrightarrow s^2,\qquad p\leftrightarrow f`, cond: 'Trái: tổng thể. Phải: mẫu.' }],
  example: { q: R`Khảo sát 200 sinh viên trong 12.000 sinh viên của trường, 130 người đi làm thêm. Xác định $N$, $n$, $f$.`, steps: [R`$N=12\,000$, $n=200$.`, R`$f=130/200=0,65$ là ước lượng cho $p$.`], ans: R`$f=0,65$.` },
  mistakes: [R`Gọi $\bar x$ là trung bình tổng thể.`],
  quiz: [
    { q: R`$\mu$ là:`, o: ['Thống kê mẫu', 'Tham số tổng thể', 'Biến ngẫu nhiên', 'Tần suất'], a: 1, why: 'μ là trung bình của tổng thể.' },
    { q: R`Vì sao $\bar X$ là biến ngẫu nhiên?`, o: ['Vì nó luôn bằng μ', 'Vì giá trị thay đổi theo mẫu được chọn', 'Vì nó là hằng số', 'Vì n lớn'], a: 1, why: 'Mỗi mẫu khác nhau cho một giá trị trung bình khác nhau.' }
  ] },

{ id: 'c4b2', ch: 4, title: 'Bảng tần số và mẫu ghép lớp', mins: 10,
  summary: 'Đọc bảng xᵢ – nᵢ và thay mỗi lớp bằng điểm giữa.',
  core: [
    R`Dữ liệu thường cho dưới dạng bảng $x_i$ – $n_i$. Với **mẫu ghép lớp** (khoảng $[a_i;b_i)$), thay mỗi lớp bằng điểm giữa $x_i=(a_i+b_i)/2$.`,
    R`Tần suất $f_i=n_i/n$. Công cụ "Thống kê mô tả" trên trang nhận trực tiếp dạng bảng này.`
  ],
  formulas: [{ name: 'Điểm giữa và trung bình', tex: R`x_i=\dfrac{a_i+b_i}{2},\qquad \bar x=\dfrac1n\sum n_ix_i`, cond: '' }],
  example: { q: R`Chiều cao (cm) của 50 sinh viên: [140;150): 5, [150;160): 12, [160;170): 18, [170;180): 10, [180;190): 5. Tính $\bar x$.`,
    steps: [R`Điểm giữa: 145, 155, 165, 175, 185.`, R`$\sum n_ix_i=725+1860+2970+1750+925=8230$.`, R`$\bar x=8230/50=164,6$.`], ans: R`$\bar x=164,6$ cm.` },
  mistakes: [R`Dùng đầu mút lớp thay cho điểm giữa.`],
  quiz: [
    { q: R`Điểm giữa của lớp $[20;30)$ là:`, o: ['20', '25', '30', '10'], a: 1, why: R`$(20+30)/2$.` },
    { q: R`Tần suất của lớp thứ $i$ là:`, o: ['nᵢ', 'nᵢ/n', 'xᵢnᵢ', 'n/nᵢ'], a: 1, why: R`$f_i=n_i/n$.` }
  ], tool: 'desc' },

{ id: 'c4b3', ch: 4, title: 'Trung bình mẫu và phương sai mẫu hiệu chỉnh', mins: 14,
  summary: 'Tính x̄, s² đúng công thức chia n − 1, và đọc đúng phím trên máy Casio.',
  core: [
    R`Phương sai mẫu hiệu chỉnh $s^2$ chia cho $n-1$ để là ước lượng **không chệch** của $\sigma^2$. Đây là đại lượng dùng trong ước lượng và kiểm định.`,
    R`Trên Casio: $s_x$ (hoặc $\sigma_{n-1}$) là độ lệch chuẩn hiệu chỉnh; $\sigma_x$ chia cho $n$. Chọn nhầm phím là lỗi rất phổ biến.`
  ],
  formulas: [
    { name: 'Phương sai hiệu chỉnh', tex: R`s^2=\dfrac{1}{n-1}\sum n_i(x_i-\bar x)^2`, cond: '' },
    { name: 'Công thức tính nhanh', tex: R`s^2=\dfrac{n}{n-1}\left(\overline{x^2}-\bar x^2\right),\quad \overline{x^2}=\dfrac1n\sum n_ix_i^2`, cond: '' }
  ],
  example: { q: R`Với bảng chiều cao ở bài trước ($\bar x=164,6$), tính $s^2$ và $s$.`,
    steps: [R`$\sum n_i(x_i-\bar x)^2=1920,8+1105,92+2,88+1081,6+2080,8=6192$.`, R`$s^2=6192/49\approx126,37$.`, R`$s\approx11,24$ cm.`], ans: R`$s^2\approx126,37$; $s\approx11,24$.` },
  mistakes: [R`Chia cho $n$ (ra 123,84) khi đề cần phương sai hiệu chỉnh.`],
  quiz: [
    { q: R`Mẫu 2, 4, 6. Phương sai hiệu chỉnh $s^2$ là:`, o: ['8/3', '4', '2', '16'], a: 1, why: R`$\bar x=4$; $(4+0+4)/2=4$.` },
    { q: R`Trên Casio, phím cho độ lệch chuẩn hiệu chỉnh là:`, o: ['σx', 'sx', 'x̄', 'Σx²'], a: 1, why: R`$s_x$ chia cho $n-1$.` }
  ], tool: 'desc' },

{ id: 'c4b4', ch: 4, title: 'Phân phối của trung bình mẫu và định lý giới hạn trung tâm', mins: 14,
  summary: 'Trung bình mẫu dao động quanh μ với độ lệch σ/√n và gần chuẩn khi n lớn.',
  core: [
    R`$E(\bar X)=\mu$ và $V(\bar X)=\sigma^2/n$. Độ lệch chuẩn của $\bar X$ là $\sigma/\sqrt n$, gọi là **sai số chuẩn**.`,
    R`**Định lý giới hạn trung tâm**: dù tổng thể có phân phối gì, khi $n$ đủ lớn (thường $n\ge30$), $\bar X$ có phân phối xấp xỉ chuẩn. Xem mô phỏng ở trang Mô phỏng.`
  ],
  formulas: [{ name: 'Phân phối của X̄', tex: R`\bar X\approx N\!\left(\mu,\ \dfrac{\sigma^2}{n}\right),\qquad Z=\dfrac{\bar X-\mu}{\sigma/\sqrt n}`, cond: 'Chính xác nếu tổng thể chuẩn; xấp xỉ khi n ≥ 30.' }],
  example: { q: R`Tổng thể có $\mu=50$, $\sigma=12$. Lấy mẫu $n=36$. Tính $P(\bar X>53)$.`, steps: [R`Sai số chuẩn $=12/6=2$.`, R`$z=(53-50)/2=1,5$.`, R`$P=1-\Phi(1,5)\approx0,0668$.`], ans: R`$\approx0,0668$.` },
  mistakes: [R`Dùng $\sigma$ thay vì $\sigma/\sqrt n$ khi tính xác suất cho trung bình mẫu.`],
  quiz: [
    { q: R`$\sigma=10$, $n=25$. Sai số chuẩn của $\bar X$ là:`, o: ['10', '2', '0,4', '4'], a: 1, why: R`$10/5=2$.` },
    { q: 'Tăng cỡ mẫu lên 4 lần thì sai số chuẩn:', o: ['Giảm một nửa', 'Giảm 4 lần', 'Không đổi', 'Tăng gấp đôi'], a: 0, why: R`$\sqrt4=2$.` }
  ], sim: 'clt' },

{ id: 'c4b5', ch: 4, title: 'Các phân phối χ², t và F', mins: 12,
  summary: 'Ba phân phối dùng cho ước lượng và kiểm định khi chưa biết σ.',
  core: [
    R`Với mẫu từ tổng thể chuẩn: $\dfrac{(n-1)s^2}{\sigma^2}\sim\chi^2(n-1)$ và $T=\dfrac{\bar X-\mu}{s/\sqrt n}\sim t(n-1)$.`,
    R`Phân phối $t$ giống chuẩn nhưng có đuôi dày hơn; khi bậc tự do lớn thì $t$ tiến về $N(0,1)$.`,
    R`Tỷ số hai phương sai mẫu (khi $\sigma_1=\sigma_2$) có phân phối $F(n_1-1,\,n_2-1)$.`
  ],
  formulas: [
    { name: 'Thống kê T', tex: R`T=\dfrac{\bar X-\mu}{s/\sqrt{n}}\sim t(n-1)`, cond: 'Tổng thể chuẩn, σ chưa biết.' },
    { name: 'Thống kê χ²', tex: R`\chi^2=\dfrac{(n-1)s^2}{\sigma^2}\sim\chi^2(n-1)`, cond: '' }
  ],
  example: { q: R`Tra $t_{0,025}(15)$.`, steps: [R`Bậc tự do 15, diện tích đuôi phải 0,025.`, R`$t_{0,025}(15)\approx2,131$ (lớn hơn 1,96 vì mẫu nhỏ).`], ans: R`$2,131$.` },
  mistakes: [R`Dùng bậc tự do $n$ thay vì $n-1$.`],
  quiz: [
    { q: R`Mẫu $n=20$. Bậc tự do của $T$ là:`, o: ['20', '19', '18', '21'], a: 1, why: R`$n-1=19$.` },
    { q: R`Khi bậc tự do rất lớn, $t_{0,025}$ tiến về:`, o: ['1,645', '1,96', '2,576', '0'], a: 1, why: R`Phân phối $t$ tiến về $N(0,1)$.` }
  ], tool: 'tdist' },

/* ================= CHƯƠNG 5 ================= */
{ id: 'c5b1', ch: 5, title: 'Ước lượng điểm và ước lượng khoảng', mins: 10,
  summary: 'Hiểu đúng ý nghĩa độ tin cậy và độ chính xác của khoảng tin cậy.',
  core: [
    R`Ước lượng điểm dùng một con số ($\bar x$ cho $\mu$). Tính chất mong muốn: **không chệch**, **hiệu quả**, **vững**.`,
    R`Khoảng tin cậy $(\hat\theta-\varepsilon;\ \hat\theta+\varepsilon)$ với độ tin cậy $\gamma=1-\alpha$. "95%" nghĩa là: nếu lặp lại việc lấy mẫu nhiều lần, khoảng 95% các khoảng tạo ra sẽ chứa tham số thật. Mô phỏng ở trang Mô phỏng cho thấy điều này.`
  ],
  formulas: [{ name: 'Dạng chung', tex: R`\hat\theta-\varepsilon<\theta<\hat\theta+\varepsilon,\qquad \gamma=1-\alpha`, cond: 'ε: độ chính xác (sai số).' }],
  example: { q: 'Một khoảng 95% cho μ là (48,9; 55,7). Diễn giải nào đúng?', steps: ['Sai: "μ nằm trong khoảng này với xác suất 95%". μ cố định; khoảng mới là ngẫu nhiên.', 'Đúng: phương pháp này tạo ra khoảng chứa μ trong khoảng 95% số lần lấy mẫu.'], ans: 'Độ tin cậy nói về phương pháp, không về một khoảng cụ thể.' },
  mistakes: ['Diễn giải độ tin cậy như xác suất tham số nằm trong khoảng đã tính.'],
  quiz: [
    { q: R`$\bar X$ là ước lượng không chệch của:`, o: ['σ', 'μ', 'p', 's'], a: 1, why: R`$E(\bar X)=\mu$.` },
    { q: 'Giữ nguyên mẫu, tăng độ tin cậy từ 95% lên 99% thì khoảng tin cậy:', o: ['Hẹp lại', 'Rộng ra', 'Không đổi', 'Dịch sang phải'], a: 1, why: 'Giá trị tới hạn tăng từ 1,96 lên 2,576.' }
  ], sim: 'ci' },

{ id: 'c5b2', ch: 5, title: 'Khoảng tin cậy cho trung bình khi biết σ', mins: 12,
  summary: 'Dùng giá trị tới hạn z khi phương sai tổng thể đã biết.',
  core: [R`Khi tổng thể chuẩn (hoặc $n\ge30$) và **đã biết** $\sigma$, dùng $z_{\alpha/2}$: 1,645 (90%), 1,96 (95%), 2,576 (99%).`],
  formulas: [{ name: 'KTC trung bình (σ biết)', tex: R`\bar x\pm z_{\alpha/2}\dfrac{\sigma}{\sqrt n}`, cond: 'σ đã biết.' }],
  example: { q: R`$\bar x=52,3$; $\sigma=6,4$; $n=16$. Tìm khoảng tin cậy 95% cho $\mu$.`, steps: [R`$\varepsilon=1,96\cdot6,4/4\approx3,136$.`, R`$(52,3-3,136;\ 52,3+3,136)=(49,164;\ 55,436)$.`], ans: R`$(49,164;\ 55,436)$.` },
  mistakes: [R`Dùng $z_\alpha$ (1,645) thay vì $z_{\alpha/2}$ (1,96) cho khoảng hai phía 95%.`],
  quiz: [
    { q: R`Giá trị $z_{\alpha/2}$ cho độ tin cậy 99% là:`, o: ['1,96', '2,326', '2,576', '1,645'], a: 2, why: R`$\Phi(2,576)\approx0,995$.` },
    { q: R`$\sigma=10$, $n=100$, độ tin cậy 95%. Độ chính xác $\varepsilon$ bằng:`, o: ['1,96', '0,196', '19,6', '1'], a: 0, why: R`$1,96\cdot10/10$.` }
  ], tool: 'cimean' },

{ id: 'c5b3', ch: 5, title: 'Khoảng tin cậy cho trung bình khi chưa biết σ', mins: 12,
  summary: 'Dùng phân phối t với mẫu nhỏ, và biết khi nào giáo trình cho phép dùng z.',
  core: [
    R`Chưa biết $\sigma$: thay bằng $s$ và dùng $t_{\alpha/2}(n-1)$, với giả thiết tổng thể chuẩn.`,
    R`Nhiều giáo trình cho phép dùng $z$ khi $n\ge30$ vì $t$ khi đó rất gần $z$. Máy tính của trang luôn tính theo $t$ chính xác và hiển thị cả giá trị $z$ để bạn đối chiếu.`
  ],
  formulas: [{ name: 'KTC trung bình (σ chưa biết)', tex: R`\bar x\pm t_{\alpha/2}(n-1)\dfrac{s}{\sqrt n}`, cond: 'Tổng thể chuẩn, σ chưa biết.' }],
  example: { q: R`$\bar x=52,3$; $s=6,4$; $n=16$. Tìm khoảng tin cậy 95% cho $\mu$.`, steps: [R`$t_{0,025}(15)\approx2,1314$.`, R`$\varepsilon=2,1314\cdot1,6\approx3,410$.`, R`$(48,890;\ 55,710)$, rộng hơn khoảng khi biết $\sigma$.`], ans: R`$(48,890;\ 55,710)$.` },
  mistakes: [R`Dùng 1,96 với $n=16$ khi chưa biết $\sigma$, khiến khoảng hẹp hơn thực tế.`],
  quiz: [
    { q: R`$n=10$, độ tin cậy 95%, chưa biết $\sigma$. Giá trị tới hạn là:`, o: ['1,96', '2,262', '2,228', '1,833'], a: 1, why: R`$t_{0,025}(9)\approx2,262$.` },
    { q: R`$n=12$, chưa biết $\sigma$, tổng thể chuẩn. Dùng phân phối:`, o: ['Chuẩn', 't(11)', 't(12)', 'χ²(11)'], a: 1, why: 'Bậc tự do n − 1 = 11.' }
  ], tool: 'cimean' },

{ id: 'c5b4', ch: 5, title: 'Khoảng tin cậy cho tỷ lệ', mins: 12,
  summary: 'Ước lượng tỷ lệ tổng thể từ tần suất mẫu.',
  core: [R`Với $n$ lớn và $nf\ge5$, $n(1-f)\ge5$: $f$ xấp xỉ chuẩn quanh $p$. Độ chính xác lớn nhất khi $f=0,5$.`],
  formulas: [{ name: 'KTC tỷ lệ', tex: R`f\pm z_{\alpha/2}\sqrt{\dfrac{f(1-f)}{n}}`, cond: 'nf ≥ 5 và n(1 − f) ≥ 5.' }],
  example: { q: R`Khảo sát 400 sinh viên, 240 người hài lòng. Ước lượng tỷ lệ hài lòng với độ tin cậy 95%.`, steps: [R`$f=0,6$; $\sqrt{0,6\cdot0,4/400}\approx0,0245$.`, R`$\varepsilon=1,96\cdot0,0245\approx0,0480$.`, R`$(0,5520;\ 0,6480)$.`], ans: R`Từ 55,2% đến 64,8%.` },
  mistakes: [R`Dùng $n$ ở tử số hoặc quên căn bậc hai.`],
  quiz: [
    { q: R`30 trên 200 người dùng sản phẩm. $f$ bằng:`, o: ['0,30', '0,15', '0,85', '30'], a: 1, why: R`$30/200=0,15$.` },
    { q: R`Cùng $n$, khoảng tin cậy tỷ lệ rộng nhất khi $f$ bằng:`, o: ['0,1', '0,5', '0,9', '1'], a: 1, why: R`$f(1-f)$ lớn nhất tại 0,5.` }
  ], tool: 'ciprop' },

{ id: 'c5b5', ch: 5, title: 'Khoảng tin cậy cho phương sai', mins: 12,
  summary: 'Dùng phân phối χ² để ước lượng độ phân tán của tổng thể chuẩn.',
  core: [R`Khoảng tin cậy cho $\sigma^2$ **không đối xứng** quanh $s^2$ vì phân phối $\chi^2$ lệch phải. Giá trị $\chi^2$ lớn đi với cận dưới.`],
  formulas: [{ name: 'KTC phương sai', tex: R`\left(\dfrac{(n-1)s^2}{\chi^2_{\alpha/2}(n-1)};\ \dfrac{(n-1)s^2}{\chi^2_{1-\alpha/2}(n-1)}\right)`, cond: 'Ký hiệu χ²ₐ: diện tích đuôi phải bằng a. Tổng thể chuẩn.' }],
  example: { q: R`$s^2=12,5$; $n=20$. Tìm khoảng tin cậy 95% cho $\sigma^2$.`, steps: [R`$\chi^2_{0,025}(19)\approx32,852$; $\chi^2_{0,975}(19)\approx8,907$.`, R`Cận dưới $=19\cdot12,5/32,852\approx7,229$.`, R`Cận trên $=19\cdot12,5/8,907\approx26,666$.`], ans: R`$(7,229;\ 26,666)$.` },
  mistakes: ['Đảo hai giá trị χ², làm cận dưới lớn hơn cận trên.'],
  quiz: [
    { q: 'Bậc tự do trong khoảng tin cậy phương sai là:', o: ['n', 'n − 1', 'n − 2', '2n'], a: 1, why: 'Thống kê (n − 1)s²/σ² có n − 1 bậc tự do.' },
    { q: 'Khoảng tin cậy cho σ² có tâm tại s² không?', o: ['Có', 'Không', 'Chỉ khi n lớn', 'Chỉ khi α = 0,05'], a: 1, why: 'Phân phối χ² không đối xứng.' }
  ], tool: 'civar' },

{ id: 'c5b6', ch: 5, title: 'Xác định cỡ mẫu', mins: 10,
  summary: 'Tính cỡ mẫu tối thiểu để đạt độ chính xác mong muốn.',
  core: [R`Giải bất phương trình $\varepsilon\le$ sai số cho phép theo $n$. Luôn **làm tròn lên**. Khi chưa biết $f$, dùng $f(1-f)=0,25$ để an toàn.`],
  formulas: [
    { name: 'Cỡ mẫu cho trung bình', tex: R`n\ge\left(\dfrac{z_{\alpha/2}\,\sigma}{\varepsilon}\right)^2`, cond: '' },
    { name: 'Cỡ mẫu cho tỷ lệ', tex: R`n\ge\dfrac{z_{\alpha/2}^2\,f(1-f)}{\varepsilon^2}`, cond: 'Chưa biết f: dùng 0,25.' }
  ],
  example: { q: R`$\sigma=15$, muốn sai số không quá 2 với độ tin cậy 95%. Cần tối thiểu bao nhiêu quan sát?`, steps: [R`$(1,96\cdot15/2)^2\approx216,08$.`, R`Làm tròn lên: $n=217$.`], ans: R`$n=217$.` },
  mistakes: ['Làm tròn xuống (216), khi đó sai số vượt mức cho phép.'],
  quiz: [
    { q: 'Tính được n ≥ 96,04. Cỡ mẫu tối thiểu là:', o: ['96', '97', '100', '95'], a: 1, why: 'Làm tròn lên.' },
    { q: 'Muốn giảm sai số còn một nửa, cỡ mẫu cần tăng:', o: ['2 lần', '4 lần', '√2 lần', 'Không cần'], a: 1, why: R`$n$ tỷ lệ với $1/\varepsilon^2$.` }
  ], tool: 'size' },

/* ================= CHƯƠNG 6 ================= */
{ id: 'c6b1', ch: 6, title: 'Khái niệm kiểm định và hai loại sai lầm', mins: 12,
  summary: 'Đặt giả thiết, hiểu mức ý nghĩa, sai lầm loại I và loại II.',
  core: [
    R`$H_0$ là giả thiết "không có gì thay đổi" (dấu =). $H_1$ là điều ta muốn tìm bằng chứng ($\ne$, $<$ hoặc $>$).`,
    R`**Sai lầm loại I**: bác bỏ $H_0$ khi $H_0$ đúng, xác suất $\alpha$. **Sai lầm loại II**: không bác bỏ $H_0$ khi $H_0$ sai, xác suất $\beta$.`,
    R`"Không bác bỏ $H_0$" chỉ có nghĩa là chưa đủ bằng chứng, không chứng minh $H_0$ đúng.`
  ],
  formulas: [{ name: 'Các xác suất', tex: R`\alpha=P(\text{bác bỏ }H_0\mid H_0\text{ đúng}),\quad \beta=P(\text{không bác bỏ }H_0\mid H_0\text{ sai})`, cond: '' }],
  example: { q: 'Nhà sản xuất nói pin dùng trung bình 20 giờ. Hội người tiêu dùng nghi ngờ pin dùng ít hơn. Đặt giả thiết.', steps: [R`$H_0:\mu=20$.`, R`$H_1:\mu<20$ (kiểm định phía trái).`], ans: R`$H_0:\mu=20$; $H_1:\mu<20$.` },
  mistakes: [R`Đặt dấu bất đẳng thức vào $H_0$.`, R`Kết luận "chấp nhận $H_0$, vậy $H_0$ đúng".`],
  quiz: [
    { q: 'Bác bỏ H₀ trong khi H₀ đúng là:', o: ['Sai lầm loại I', 'Sai lầm loại II', 'Quyết định đúng', 'Lực kiểm định'], a: 0, why: 'Xác suất của nó là α.' },
    { q: 'Không bác bỏ H₀ có nghĩa là:', o: ['H₀ chắc chắn đúng', 'Chưa đủ bằng chứng để bác bỏ H₀', 'H₁ sai', 'α = 0'], a: 1, why: 'Kiểm định chỉ đo sức mạnh bằng chứng chống lại H₀.' }
  ] },

{ id: 'c6b2', ch: 6, title: 'Kiểm định trung bình khi biết σ', mins: 12,
  summary: 'Dùng thống kê Z và miền bác bỏ theo phía của H₁.',
  core: [R`Hai phía: bác bỏ khi $|Z|>z_{\alpha/2}$. Phía phải: $Z>z_\alpha$. Phía trái: $Z<-z_\alpha$.`],
  formulas: [{ name: 'Thống kê Z', tex: R`Z=\dfrac{\bar x-\mu_0}{\sigma/\sqrt n}`, cond: 'σ đã biết; tổng thể chuẩn hoặc n ≥ 30.' }],
  example: { q: R`Máy đóng gói 500 g, $\sigma=10$ g. Mẫu 25 gói có $\bar x=496$. Với $\alpha=5\%$, máy có hoạt động bình thường không?`, steps: [R`$H_0:\mu=500$; $H_1:\mu\ne500$.`, R`$Z=(496-500)/(10/5)=-2$.`, R`$|Z|=2>1,96$: bác bỏ $H_0$. $p\approx0,0455$.`], ans: 'Máy hoạt động không bình thường (đóng thiếu).' },
  mistakes: [R`Dùng $z_\alpha=1,645$ cho kiểm định hai phía.`],
  quiz: [
    { q: R`Kiểm định một phía với $\alpha=0,05$ dùng giá trị tới hạn:`, o: ['1,96', '1,645', '2,576', '2,326'], a: 1, why: R`$\Phi(1,645)\approx0,95$.` },
    { q: R`Hai phía, $\alpha=5\%$, $Z=1,5$. Kết luận:`, o: ['Bác bỏ H₀', 'Không bác bỏ H₀', 'Không đủ dữ liệu', 'Chấp nhận H₁'], a: 1, why: R`$1,5<1,96$.` }
  ], tool: 'testmean' },

{ id: 'c6b3', ch: 6, title: 'Kiểm định trung bình khi chưa biết σ', mins: 12,
  summary: 'Kiểm định t một mẫu, và thấy dùng nhầm z dẫn tới kết luận sai.',
  core: [R`Chưa biết $\sigma$, mẫu nhỏ: dùng $T$ với $n-1$ bậc tự do. Giá trị tới hạn $t$ lớn hơn $z$, nên khó bác bỏ hơn.`],
  formulas: [{ name: 'Thống kê T', tex: R`T=\dfrac{\bar x-\mu_0}{s/\sqrt n}\sim t(n-1)`, cond: 'Tổng thể chuẩn, σ chưa biết.' }],
  example: { q: R`$\bar x=103,2$; $s=8$; $n=25$. Kiểm định $H_0:\mu=100$ với $\alpha=5\%$, hai phía.`, steps: [R`$T=(103,2-100)/(8/5)=2$.`, R`$t_{0,025}(24)\approx2,064$.`, R`$|T|=2<2,064$: không bác bỏ $H_0$; $p\approx0,0569$.`, R`Nếu dùng nhầm 1,96 sẽ bác bỏ $H_0$, một kết luận sai.`], ans: R`Không bác bỏ $H_0$.` },
  mistakes: [R`Dùng $z$ với mẫu nhỏ khi chưa biết $\sigma$.`],
  quiz: [
    { q: R`$n=25$. Bậc tự do của $T$ là:`, o: ['25', '24', '23', '26'], a: 1, why: R`$n-1$.` },
    { q: R`$|T|=2,5$, giá trị tới hạn 2,064. Kết luận:`, o: ['Bác bỏ H₀', 'Không bác bỏ H₀', 'Cần thêm dữ liệu', 'Dùng z'], a: 0, why: R`$2,5>2,064$.` }
  ], tool: 'testmean' },

{ id: 'c6b4', ch: 6, title: 'Kiểm định tỷ lệ', mins: 12,
  summary: 'Kiểm định một tỷ lệ tổng thể, dùng p₀ ở mẫu số.',
  core: [R`Dưới $H_0$, tỷ lệ thật là $p_0$, nên sai số chuẩn dùng $p_0$, không dùng $f$. Đây là điểm khác với khoảng tin cậy.`],
  formulas: [{ name: 'Thống kê Z', tex: R`Z=\dfrac{f-p_0}{\sqrt{p_0(1-p_0)/n}}`, cond: 'np₀ ≥ 5 và n(1 − p₀) ≥ 5.' }],
  example: { q: R`Công ty nói 70% khách hài lòng. Khảo sát 200 khách có 128 người hài lòng. Với $\alpha=5\%$, có thể cho rằng tỷ lệ thấp hơn công bố không?`, steps: [R`$H_0:p=0,7$; $H_1:p<0,7$.`, R`$f=0,64$; $Z=(0,64-0,7)/\sqrt{0,21/200}\approx-1,852$.`, R`$Z<-1,645$: bác bỏ $H_0$. $p\approx0,032$.`], ans: 'Tỷ lệ hài lòng thấp hơn 70%.' },
  mistakes: [R`Dùng $\sqrt{f(1-f)/n}$ ở mẫu số.`],
  quiz: [
    { q: 'Mẫu số của thống kê kiểm định tỷ lệ dùng:', o: ['f', 'p₀', '0,5', 's'], a: 1, why: 'Tính dưới giả thiết H₀ đúng.' },
    { q: R`$H_1:p>0,4$ là kiểm định:`, o: ['Hai phía', 'Phía phải', 'Phía trái', 'Phương sai'], a: 1, why: 'Dấu > trong H₁.' }
  ], tool: 'testprop' },

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const NF = {};
function fmt(x, d = 4) {
  if (x == null || Number.isNaN(x)) return '—';
  if (!Number.isFinite(x)) return x > 0 ? '+∞' : '−∞';
  if (Math.abs(x) > 0 && Math.abs(x) < 1e-6) return x.toExponential(3).replace('.', ',');
  const k = d + ':' + (Number.isInteger(x) && d > 0 ? 'i' : 'f');
  NF[k] = NF[k] || new Intl.NumberFormat('vi-VN', { minimumFractionDigits: Number.isInteger(x) ? 0 : d, maximumFractionDigits: d, useGrouping: false });
  return NF[k].format(x).replace('-', '−');
}
const pct = (x, d = 2) => fmt(x * 100, d) + '%';
function num(s) { if (typeof s === 'number') return s; const t = String(s ?? '').trim().replace(/\s/g, '').replace(',', '.'); return t === '' ? NaN : Number(t); }
function list(s) { return String(s || '').split(/[\s;]+/).map(t => t.replace(',', '.')).filter(Boolean).map(Number).filter(Number.isFinite); }

function tex(s, display = false) {
  const src = String(s).replace(/(\d),(\d)/g, '$1{,}$2');
  if (window.katex) {
    try { return katex.renderToString(src, { output: 'mathml', throwOnError: false, displayMode: display, strict: 'ignore' }); } catch (e) { /* fall through */ }
  }
  return `<code>${esc(s)}</code>`;
}
function md(s) {
  const parts = String(s ?? '').split('$');
  return parts.map((p, i) => i % 2 ? tex(p) : esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')).join('');
}

function simGalton(box) {
  simShell(box, 'Bảng Galton', 'Mỗi viên bi gặp từng hàng đinh và rẽ phải với xác suất p. Vị trí cuối cùng là số lần rẽ phải, nên có phân phối nhị thức B(n, p). Đường cong là số bi kỳ vọng theo lý thuyết.',
    sl('gr', 'Số hàng đinh n', 4, 16, 1, 10) + sl('gp', 'Xác suất rẽ phải p', 0.1, 0.9, 0.05, 0.5, v => fmt(+v, 2)) + sl('gs', 'Tốc độ', 1, 10, 1, 4) + `<button class="btn btn-ghost" id="greset" type="button">${icon('refresh')} Đặt lại</button>`,
    rd('g-n', 'Số bi đã rơi') + rd('g-m', 'Trung bình quan sát') + rd('g-e', 'Kỳ vọng np') + rd('g-s', 'Độ lệch chuẩn quan sát / √npq'), 'c3b1');
  const cv = $('#simCv'); let rows = 10, p = .5, speed = 4, bins, balls, total, sum, sum2, acc = 0, last = 0;
  const reset = () => { bins = new Array(rows + 1).fill(0); balls = []; total = 0; sum = 0; sum2 = 0; };
  reset();
  const bind = (id, fn) => { const i = $('#' + id); i.oninput = () => { $('#' + id + '-v').textContent = id === 'gp' ? fmt(+i.value, 2) : i.value; fn(+i.value); }; };
  bind('gr', v => { rows = v; reset(); }); bind('gp', v => { p = v; reset(); }); bind('gs', v => speed = v); $('#greset').onclick = reset;
  simLoop(ts => {
    const { ctx, w, h } = setupCanvas(cv), dt = Math.min(50, ts - last || 16); last = ts;
    const top = 26, pegH = h * .5, gap = Math.min(w / (rows + 3), 46), cx = w / 2, binTop = top + pegH + 14, binBase = h - 22;
    acc += dt * speed / 120; while (acc > 1) { acc -= 1; if (balls.length < 220) { const ks = [0]; for (let r = 0; r < rows; r++) ks.push(ks[r] + (Math.random() < p ? 1 : 0)); balls.push({ seg: -1, t: 0, ks }); } }
    ctx.clearRect(0, 0, w, h);
    const peg = (r, k) => [cx + (k - r / 2) * gap, top + (r + 1) * pegH / (rows + 1)];
    ctx.fillStyle = cssVar('--muted');
    for (let r = 0; r < rows; r++) for (let k = 0; k <= r; k++) { const [x, y] = peg(r, k); ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill(); }
    const maxB = Math.max(4, ...bins), crim = cssVar('--crimson'), unit = (binBase - binTop) / Math.max(maxB, 1);
    for (let k = 0; k <= rows; k++) { const x = cx + (k - rows / 2) * gap, bh = bins[k] * unit; ctx.fillStyle = cssVar('--plot-fill'); ctx.fillRect(x - gap * .42, binBase - bh, gap * .84, bh); ctx.fillStyle = crim; ctx.fillRect(x - gap * .42, binBase - bh, gap * .84, 2); }
    if (total > 0) { ctx.strokeStyle = cssVar('--plot-line'); ctx.lineWidth = 2; ctx.beginPath(); for (let k = 0; k <= rows; k++) { const x = cx + (k - rows / 2) * gap, y = binBase - total * XS.binomPmf(k, rows, p) * unit; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
    ctx.strokeStyle = cssVar('--line'); ctx.beginPath(); ctx.moveTo(cx - (rows / 2 + .6) * gap, binBase + .5); ctx.lineTo(cx + (rows / 2 + .6) * gap, binBase + .5); ctx.stroke();
    ctx.fillStyle = cssVar('--muted'); ctx.font = '11px ' + cssVar('--f-mono'); ctx.textAlign = 'center';
    for (let k = 0; k <= rows; k++) ctx.fillText(k, cx + (k - rows / 2) * gap, h - 6);
    ctx.fillStyle = crim;
    balls = balls.filter(b => {
      if (b.ks.length !== rows + 1) return false;
      const pos = i => i < 0 ? [cx, 6] : i < rows ? peg(i, b.ks[i]) : [cx + (b.ks[rows] - rows / 2) * gap, binTop];
      b.t += dt / (240 / Math.sqrt(speed));
      while (b.t >= 1) { b.t -= 1; b.seg++; if (b.seg >= rows) { const k = b.ks[rows]; bins[k]++; total++; sum += k; sum2 += k * k; return false; } }
      const [x0, y0] = pos(b.seg), [x1, y1] = pos(b.seg + 1), u = b.t;
      ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u - Math.sin(u * Math.PI) * 7 - 5, 4, 0, 7); ctx.fill(); return true;
    });

      $('#g-n').textContent = total; $('#g-m').textContent = fmt(m, 3); $('#g-e').textContent = fmt(rows * p, 3); $('#g-s').textContent = `${fmt(s, 3)} / ${fmt(Math.sqrt(rows * p * (1 - p)), 3)}`;
    }
  });
}

      const fn=dist==='normal'?XS.normCdf:XS.laplace;
      $('#tbresult',el).textContent=(dist==='normal'?'Φ(':'φ₀(')+fmt(val,2)+') = '+fmt(fn(val),6);
      $('#tbnote',el).textContent=dist==='normal'?'Φ(z) = P(Z ≤ z). Nếu z âm: Φ(−z) = 1 − Φ(z). Bảng dưới tra z ≥ 0.':'φ₀(z) = Φ(z) − 0,5, là diện tích từ 0 đến z (không phải mật độ chuẩn). Với z âm dùng đối xứng.';
      const v=Math.abs(val), row=Math.floor((v+1e-9)*10)/10, col=Math.round((v-row)*100);const start=Math.max(0,Math.floor(row*10)-4),end=Math.min(39,Math.floor(row*10)+5);
      let rows='';for(let i=start;i<=end;i++){const base=i/10;rows+=`<tr><th scope="row">${base.toFixed(1)}</th>`;for(let j=0;j<10;j++){const z=base+j/100,selected=i===Math.floor(row*10)&&j===col;rows+=`<td ${selected?'style="background:#dceaff;color:#154c9b;font-weight:800;outline:2px solid #5684d8;outline-offset:-2px"':''}>${fn(z).toFixed(4)}</td>`;}rows+='</tr>';}
      table.innerHTML=`<table class="data" style="min-width:670px;text-align:center"><thead><tr><th>z</th>${Array.from({length:10},(_,i)=>`<th>0,0${i}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
      return;
    }
    if(!Number.isInteger(nu)||nu<=0){$('#tbresult',el).textContent='Bậc tự do phải là số nguyên dương';table.innerHTML='';return;}
    const p=1-(two?a/2:a);
    if(dist==='zcrit'){
      const z=XS.normInv(p);$('#tbresult',el).textContent='z tới hạn = '+fmt(z,6);
      $('#tbnote',el).textContent=two?'Kiểm định hai phía: ±z(1−α/2), mỗi đuôi có xác suất α/2.':'Kiểm định một phía: z(1−α) cho đuôi phải; đuôi trái lấy đối dấu.';
      table.innerHTML=`<table class="data"><thead><tr><th>α</th><th>z một phía</th><th>±z hai phía</th></tr></thead><tbody>${alphas.map(v=>`<tr ${v===a?'style="background:#dceaff"':''}><td>${fmt(v,3)}</td><td>${fmt(XS.normInv(1-v),4)}</td><td>±${fmt(XS.normInv(1-v/2),4)}</td></tr>`).join('')}</tbody></table>`;return;
    }
    const inv=dist==='t'?(prob,k)=>XS.tInv(prob,k):(prob,k)=>XS.chi2Inv(prob,k);
    const critical=inv(dist==='t'?p:1-a,nu);
    $('#tbresult',el).textContent=(dist==='t'?'t':'χ²')+' tới hạn = '+fmt(critical,6);
    $('#tbnote',el).textContent=dist==='t'?'Student t: bảng giá trị tới hạn đuôi phải; với kiểm định hai phía, dùng α/2.':'χ²: bảng đuôi phải P(χ² > c) = α. Với khoảng tin cậy phương sai cần cả hai mốc α/2 và 1−α/2.';
    table.innerHTML=`<table class="data" style="min-width:560px"><thead><tr><th>ν \\ α (đuôi phải)</th>${alphas.map(v=>`<th>${fmt(v,3)}</th>`).join('')}</tr></thead><tbody>${[...new Set([...dfs,nu])].sort((a,b)=>a-b).map(k=>`<tr ${k===nu?'style="background:#dceaff"':''}><th scope="row">${k}</th>${alphas.map(v=>`<td ${k===nu&&Math.abs(v-(dist==='t'&&two?a/2:a))<1e-10?'style="font-weight:800"':''}>${fmt(inv(1-v,k),4)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  buttons.forEach(b=>b.onclick=()=>{dist=b.dataset.dist;draw()});[x,df,alpha,tail].forEach(i=>i.addEventListener('input',draw));draw();
};
function boot(){document.getElementById('app').innerHTML='<main class="main" id="main"><div class="page" id="page"></div></main>';window.addEventListener('hashchange',render);if(!location.hash)location.hash='#maytinh-normal';render();}
boot();
</script></body></html>
